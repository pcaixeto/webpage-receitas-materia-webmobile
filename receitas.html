<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas Deliciosas</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <header>
    <h1>Receitas Deliciosas</h1>
    <nav aria-label="Menu de navegação">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="receitas.html">Receitas</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="carousel" aria-label="Carrossel de Receitas">
      <div class="carousel-inner">
        <article class="recipe-card">
          <img src="assets/image/bolo-chocolate-resized.jpeg" alt="Imagem do Bolo de Chocolate">
            <h2>Bolo de Chocolate</h2>
            <p>Um bolo delicioso e fácil de fazer, perfeito para qualquer ocasião.</p>
            <a href="#" class="btn recipe-btn">Ver Receita</a>
        </article>

        <article class="recipe-card">
          <img src="assets/image/salada-colorida-resized.jpeg" alt="Imagem da Salada Colorida">
            <h2>Salada Colorida</h2>
            <p>Refrescante e saudável, ideal para acompanhar suas refeições.</p>
            <a href="#" class="btn recipe-btn">Ver Receita</a>
        </article>
      </div>
      <button class="carousel-control prev" aria-label="Receita anterior">‹</button>
      <button class="carousel-control next" aria-label="Próxima receita">›</button>
    </section>
  </main>

  <script src="assets/js/scripts.js"></script>
</body>
</html>
