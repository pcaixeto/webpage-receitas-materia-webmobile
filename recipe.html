<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receita</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
</head>
<body>
  <header>
    <h1 id="header-title">Receita</h1>
    <nav aria-label="Menu de navegação">
      <ul>
        <li><a href="index.html">Receitas</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article class="recipe-detail">
      <img id="recipe-image" src="" alt="Imagem da Receita">
      <section class="recipe-info">
        <h2 id="recipe-title">Título da Receita</h2>
        <h3>Ingredientes:</h3>
        <ul id="ingredients-list"></ul>
        <h3>Modo de Preparo:</h3>
        <ol id="instructions-list"></ol>
      </section>
    </article>
  </main>

  <!-- Elemento para a push notification (toast) da dica -->
  <aside id="push-notification" role="alert">
    <p>Dica: Utilize ingredientes frescos para potencializar os sabores da receita!</p>
  </aside>

  <script src="assets/js/scripts.js"></script>
</body>
</html>
